openapi: 3.1.0
info:
  title: Everkeep Service API
  version: 0.3.0
  description: Evidence-gated reference API for GoreeCloud Everkeep resilience, recovery, assurance, preservation, portability, and succession.
servers:
  - url: https://everkeep.goreecloud.internal
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Service health}
  /ready:
    get:
      operationId: readiness
      responses:
        '200': {description: Service readiness}
        '503': {description: Service not ready}
  /v1/resources:
    get:
      operationId: listResources
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}}
        - {name: application, in: query, schema: {type: string}}
        - {name: tier, in: query, schema: {type: string}}
      responses:
        '200': {description: Resource page}
    post:
      operationId: registerResource
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../contracts/everkeep.resource.schema.json}
      responses:
        '201': {description: Resource registered}
        '409': {description: Duplicate resource}
  /v1/resources/{resourceId}:
    get:
      operationId: getResource
      parameters:
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '200': {description: Resource}
        '404': {description: Not found}
  /v1/resources/{resourceId}/recovery-center:
    get:
      operationId: getRecoveryCenterProjection
      parameters:
        - {$ref: '#/components/parameters/ResourceId'}
      responses:
        '200': {description: Resource Recovery Center projection}
        '404': {description: Not found}
  /v1/resources/{resourceId}/evidence-timeline:
    get:
      operationId: getResourceEvidenceTimeline
      parameters:
        - {$ref: '#/components/parameters/ResourceId'}
        - {name: category, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        '200':
          description: Deterministic current and historical evidence timeline
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.evidence-timeline.schema.json}
        '404': {description: Resource not found}
  /v1/resources/{resourceId}/restore-test-schedule/evaluate:
    post:
      operationId: evaluateRestoreTestSchedule
      parameters:
        - {$ref: '#/components/parameters/ResourceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scheduleId, policyId]
              properties:
                scheduleId: {type: string, minLength: 1}
                policyId: {type: string, minLength: 1}
      responses:
        '200':
          description: Policy-derived restore-test schedule and dispatch eligibility
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.restore-test-schedule.schema.json}
        '409': {description: Policy or evidence cannot produce a dispatchable restore test}
  /v1/recovery-center/summary:
    get:
      operationId: getRecoveryCenterSummary
      responses:
        '200':
          description: Fleet Recovery Center summary derived from current evidence
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.recovery-center.summary.schema.json}
  /v1/policies/{policyId}:
    get:
      operationId: getPolicy
      parameters:
        - {name: policyId, in: path, required: true, schema: {type: string}}
        - {name: version, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Policy}
        '404': {description: Not found}
    put:
      operationId: savePolicy
      parameters:
        - {name: policyId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../contracts/everkeep.protection-policy.schema.json}
      responses:
        '200': {description: Policy version created}
        '412': {description: ETag precondition failed}
  /v1/recovery-points:
    post:
      operationId: ingestRecoveryPoint
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../contracts/everkeep.recovery-point.schema.json}
      responses:
        '201': {description: Recovery point recorded}
  /v1/recovery-points/{recoveryPointId}/state:
    post:
      operationId: transitionRecoveryPoint
      parameters:
        - {name: recoveryPointId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [available, verifying, blocked, expired]}
      responses:
        '200': {description: State transitioned}
        '409': {description: Invalid lifecycle transition}
  /v1/recovery-plans:
    post:
      operationId: createRecoveryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [planId, targetResourceIds, mode]
              properties:
                planId: {type: string, minLength: 1}
                targetResourceIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
                mode: {enum: [dry-run, sandbox, restore]}
                requestedRecoveryPointIds: {type: object, additionalProperties: {type: string}}
      responses:
        '201':
          description: Deterministic recovery plan created
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.recovery-plan.schema.json}
        '409': {description: Dependency graph or planning conflict}
  /v1/recovery-plans/{planId}:
    get:
      operationId: getRecoveryPlan
      parameters:
        - {$ref: '#/components/parameters/PlanId'}
      responses:
        '200':
          description: Recovery plan
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.recovery-plan.schema.json}
        '404': {description: Not found}
  /v1/recovery-plans/{planId}/authorize:
    post:
      operationId: authorizeRecoveryExecution
      parameters:
        - {$ref: '#/components/parameters/PlanId'}
      responses:
        '200':
          description: Evidence-gated execution decision
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.recovery-execution.schema.json}
        '409': {description: Recovery execution blocked by current evidence}
  /v1/preservation/capsules:
    post:
      operationId: createPreservationCapsule
      responses:
        '201':
          description: Deterministic preservation capsule manifest created
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.preservation-capsule.schema.json}
        '409': {description: Missing digest, authority, or preservation requirement}
  /v1/portability/exports:
    post:
      operationId: createPortabilityManifest
      responses:
        '201':
          description: Evidence-gated portability manifest created
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.portability-manifest.schema.json}
        '409': {description: Export authority or integrity evidence does not permit a positive portability claim}
  /v1/succession/policies:
    post:
      operationId: createSuccessionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../contracts/everkeep.succession-policy.schema.json}
      responses:
        '201': {description: Succession policy recorded}
        '409': {description: Policy conflicts with current authority or validation rules}
  /v1/succession/policies/{successionPolicyId}:
    get:
      operationId: getSuccessionPolicy
      parameters:
        - {$ref: '#/components/parameters/SuccessionPolicyId'}
      responses:
        '200':
          description: Succession policy
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.succession-policy.schema.json}
        '404': {description: Not found}
  /v1/succession/policies/{successionPolicyId}/evaluate:
    post:
      operationId: evaluateSuccessionPolicy
      parameters:
        - {$ref: '#/components/parameters/SuccessionPolicyId'}
      responses:
        '200':
          description: Evidence-gated succession activation eligibility decision
          content:
            application/json:
              schema: {$ref: ../contracts/everkeep.succession-decision.schema.json}
        '409': {description: Activation blocked or unknown; no succession execution authorized}
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - {name: afterSequence, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        '200': {description: Audit event page}
components:
  parameters:
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: {type: string}
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string}
    SuccessionPolicyId:
      name: successionPolicyId
      in: path
      required: true
      schema: {type: string}
  securitySchemes:
    goreecloudIdentity:
      type: openIdConnect
      openIdConnectUrl: https://identity.goreecloud.internal/.well-known/openid-configuration
security:
  - goreecloudIdentity: []
