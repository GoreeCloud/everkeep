schema_version: "0.2"

component:
  type: service
  id: goreecloud-everkeep
  product_name: Everkeep
  repository: GoreeCloud/goreecloud-everkeep

lifecycle: development
version: phase-3.5-development

supported_platforms:
  - web
  - linux-server

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - contracts/everkeep.recovery-center.summary.schema.json
    notes: Everkeep may provide minimized resilience and recovery status to GoreeCloud Manager, but no accepted live end-to-end Manager integration is established by this source candidate.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PHASE-2-RECOVERY-ORCHESTRATION.md
      - docs/PHASE-3-FAILOVER-GOVERNANCE.md
    notes: Everkeep revalidates Privacy Shield authority for recovery, portability, succession, failover, and rollback-sensitive operations, while live provider acceptance remains independently required.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PHASE-2-RECOVERY-ORCHESTRATION.md
      - docs/PHASE-3-FAILOVER-GOVERNANCE.md
      - docs/RESTORE-VERIFICATION.md
    notes: Everkeep consumes Wardveil security evidence as a gate and coordinates post-recovery verification without inheriting Wardveil security authority; live provider acceptance remains incomplete.
  everkeep:
    result: not-applicable-justified
    version: phase-3.5-development
    evidence:
      - README.md
      - docs/PHASE-1-CORE.md
    notes: This repository implements the Everkeep resilience and continuity authority itself; a separate Everkeep-to-Everkeep integration is not applicable.
  glaze_ui:
    result: applicable-migration-required
    version: 2.1.0
    evidence:
      - website/index.html
      - website/glaze-ui-2.1.0.css
    notes: The Continuity Center currently uses an older Glaze 2.1 Stable source baseline. Migration and rendered acceptance against current Stable GLAZE UI V1.1 / 1.1.0 are required.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - docs/MESH-EVIDENCE.md
      - contracts/mesh.integration.json
      - contracts/everkeep.mesh-evidence-profile.json
      - contracts/everkeep.platform-evidence.runtime-acceptance.json
      - runtime/mesh_delivery.py
      - runtime/platform_registry_delivery.py
      - scripts/test_mesh_delivery.py
      - scripts/test_mesh_identity_boundary.py
      - scripts/test_platform_registry_delivery.py
    notes: Source-level minimized continuity evidence delivery and producer-bound Platform Registry publication are implemented with separate least-privilege Identity scopes. Everkeep's registry transport explicitly preserves backup and verified-restore as distinct facts. Live Identity issuance/JWKS trust and Mesh publication/consumption acceptance remain separate gates.
    capabilities:
      - continuity-evidence-delivery
      - platform-registry-publication
    dependencies:
      - goreecloud-identity
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PHASE-2-RECOVERY-ORCHESTRATION.md
      - docs/PHASE-2-SUCCESSION.md
      - contracts/mesh.integration.json
      - runtime/mesh_delivery.py
      - runtime/platform_registry_delivery.py
      - scripts/test_mesh_identity_boundary.py
      - scripts/test_platform_registry_delivery.py
    notes: Everkeep recovery, succession, approval, executor handoff, evidence delivery, and Platform Registry publication depend on GoreeCloud Identity authority. Source clients request narrowly scoped credentials, but production issuance, workload binding, JWKS trust, rotation/revocation, and live provider integration remain unaccepted.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect Everkeep-owned registries, policies, recovery points, evidence references, durable outbox state, recovery plans, topology, governance, drill, rollback, and assurance state before production dependence.
      - Preserve independent copies of the recovery knowledge needed to restore Everkeep itself so Everkeep is not a circular single point of recovery authority.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration of Everkeep control-plane state, evidence integrity, durable outbox continuity, recovery topology, governance history, and required provider integrations.
      - Keep backup existence distinct from verified restoration; a successful backup operation alone must never satisfy restore acceptance.
  export:
    required: true
    requirements:
      - Provide independently usable export for Everkeep-owned registries, policies, evidence metadata, preservation manifests, portability manifests, recovery topology, governance, and continuity history where applicable.
  portability:
    required: true
    requirements:
      - Keep preservation, recovery, topology, succession, evidence, and continuity records documented and portable without requiring Everkeep itself to be online to interpret the only surviving recovery record.

external_dependencies:
  - name: PostgreSQL
    purpose: Durable Everkeep control-plane persistence, recovery/evidence state, governance records, and outbox semantics for applicable deployed runtime paths.
    required: true

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - docs/PHASE-1-CORE.md
    - docs/PHASE-2-RECOVERY-CENTER.md
    - docs/PHASE-2-RECOVERY-ORCHESTRATION.md
    - docs/PHASE-2-RESTORE-TESTING.md
    - docs/PHASE-2-PRESERVATION-PORTABILITY.md
    - docs/PHASE-2-SUCCESSION.md
    - docs/PHASE-3-FAILOVER-PLANNING.md
    - docs/PHASE-3-FAILOVER-GOVERNANCE.md
    - docs/PHASE-3-FAILOVER-EXECUTOR.md
    - docs/PHASE-3-DRILL-OPERATIONS.md
    - docs/RESTORE-VERIFICATION.md
    - contracts/mesh.integration.json
    - runtime/mesh_delivery.py
    - runtime/platform_registry_delivery.py
    - scripts/test_mesh_delivery.py
    - scripts/test_mesh_identity_boundary.py
    - scripts/test_platform_registry_delivery.py
    - website/index.html
  blockers:
    - Everkeep remains in Development; source-level recovery and continuity capabilities do not establish production recovery acceptance.
    - Current Stable GLAZE UI V1.1 / 1.1.0 migration and rendered Continuity Center acceptance remain outstanding.
    - Source-level Identity-scoped evidence and Platform Registry clients are implemented, but live GoreeCloud Identity issuance/JWKS trust and end-to-end GoreeCloud Mesh acceptance remain outstanding.
    - Live Privacy Shield, Wardveil Security, Manager, Monitoring, and Notify provider acceptance remains environment- and revision-bound.
    - Production-effect failover, traffic mutation, production data movement, and infrastructure provisioning remain intentionally outside the current reference executor authority.
    - Verified restore evidence must remain distinct from backup existence and requires independent exact-environment proof.
    - Everkeep's own clean-environment recovery, independent recovery knowledge, rollback, and disaster-recovery acceptance remain incomplete.
    - Target-environment failure-mode, dependency, key-material, monitoring, rollback, publication, and production acceptance remain pending.
    - Required Stable acceptance-test and published release evidence has not been produced.
