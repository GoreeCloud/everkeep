name: Migrate Continuity Center to Glaze UI 1.5 Stable

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/glaze-ui-1.5-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor and apply Glaze UI 1.5.0
        shell: python
        run: |
          from pathlib import Path
          import re
          import urllib.request

          root = Path.cwd()
          site = root / "website"
          revision = "2c5078410d022eba683c8e029bc3cafe773df0b7"
          files = ["glaze.css","glaze.controls.css","glaze.expressive.css","glaze.formfactors.css","glaze.accessibility.css","glaze.color.css","glaze.motion.css","glaze.materials.css","glaze.layout.css","glaze.states.css"]
          base = f"https://raw.githubusercontent.com/GoreeCloud/goreecloud-glaze-ui/{revision}/css"
          parts = ["/* GoreeCloud Glaze UI 1.5.0 Stable — Continuity Center vendored bundle. */", f"/* Source revision: {revision}. */"]
          for name in files:
              with urllib.request.urlopen(f"{base}/{name}", timeout=30) as response:
                  parts.append(f"\n/* ===== {name} ===== */\n" + response.read().decode("utf-8"))
          parts.append(r'''
          body.glaze-canvas { margin:0; min-height:100vh; color:var(--glaze-text); font-family:var(--glaze-font-sans); background:radial-gradient(circle at 12% -8%,color-mix(in srgb,var(--glaze-success) 9%,transparent),transparent 34rem),radial-gradient(circle at 87% 2%,color-mix(in srgb,var(--glaze-accent) 10%,transparent),transparent 30rem),linear-gradient(180deg,var(--glaze-canvas-accent),var(--glaze-canvas)); }
          .site-header,header { border-bottom:1px solid var(--glaze-line); background:color-mix(in srgb,var(--glaze-surface-strong) 84%,transparent); -webkit-backdrop-filter:blur(var(--glaze-blur)) saturate(135%); backdrop-filter:blur(var(--glaze-blur)) saturate(135%); }
          .card,.glass-card,.hero-card,.continuity-card,.grid>article,article { border-color:var(--glaze-line); border-radius:var(--glaze-radius-xl); box-shadow:var(--glaze-shadow-soft); }
          button,.button,a.button { min-height:var(--glaze-target-min); border-radius:var(--glaze-radius-control); transition:transform var(--glaze-motion-fast) var(--glaze-ease-standard),box-shadow var(--glaze-motion-fast) var(--glaze-ease-standard); }
          nav a,.badge,.eyebrow,.pill { border-radius:var(--glaze-radius-pill); }
          a:focus-visible,button:focus-visible,[tabindex]:focus-visible { outline:var(--glaze-focus-width) solid var(--glaze-accent); outline-offset:var(--glaze-focus-offset); }
          @media (hover:hover) and (pointer:fine) { .card:hover,.glass-card:hover,.continuity-card:hover,.grid>article:hover { transform:translateY(-2px); box-shadow:var(--glaze-shadow-raised); } }
          @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:0ms!important; } }
          @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { .site-header,header { background:var(--glaze-surface-strong); } }
          ''')
          (site / "glaze-ui-1.5.0.css").write_text("\n".join(parts).replace("          ", ""), encoding="utf-8")

          index = site / "index.html"
          text = index.read_text(encoding="utf-8")
          meta = '  <meta name="goreecloud-glaze-ui" content="1.5.0">\n'
          link = '  <link rel="stylesheet" href="glaze-ui-1.5.0.css" data-glaze-ui="1.5.0">\n'
          if 'name="goreecloud-glaze-ui"' not in text:
              text = text.replace("</head>", meta + link + "</head>", 1)
          elif 'data-glaze-ui="1.5.0"' not in text:
              text = text.replace("</head>", link + "</head>", 1)
          text = re.sub(r'<body(?![^>]*\bclass=)([^>]*)>', r'<body class="glaze-canvas"\1>', text, count=1)
          text = re.sub(r'<body([^>]*\bclass=")([^"]*)"', lambda m: m.group(0) if "glaze-canvas" in m.group(2).split() else f'<body{m.group(1)}{m.group(2)} glaze-canvas"', text, count=1)
          index.write_text(text, encoding="utf-8")

          (site / "GLAZE-UI-1.5-ADOPTION.md").write_text(f'''# Continuity Center — Glaze UI 1.5.0 adoption\n\nThe Continuity Center targets **Glaze UI 1.5.0 Stable** from `GoreeCloud/goreecloud-glaze-ui` revision `{revision}`. Stable web layers are vendored in the Everkeep website deployment and mapped onto continuity, preservation, recovery, portability, succession, assurance, focus, material, and reduced-motion presentation. Candidate/Wearable layers are excluded.\n''', encoding="utf-8")
      - name: Commit migration
        run: |
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add website
          if git diff --cached --quiet; then
            echo "Glaze UI 1.5.0 migration already applied"
          else
            git commit -m "Adopt Glaze UI 1.5 Stable on Continuity Center"
            git push
          fi
