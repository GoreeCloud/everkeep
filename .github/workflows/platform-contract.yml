name: Platform Contract

on:
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@cd8827712a83189e63e9ba6378aa28e89f3d1f5a
    with:
      manifest-path: goreecloud.platform.yaml
