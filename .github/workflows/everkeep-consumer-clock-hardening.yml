name: Everkeep Consumer Clock Hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply bounded fail-closed clock hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          validator = Path("scripts/validate_restore_verification_v12.py")
          source = validator.read_text(encoding="utf-8")

          replacements = [
              (
                  "    now: datetime,\n) -> bool:\n",
                  "    now: object,\n) -> bool:\n",
              ),
              (
                  "    if now.tzinfo is None or now.utcoffset() is None:\n        return False\n",
                  "    if not isinstance(now, datetime) or now.tzinfo is None or now.utcoffset() is None:\n        return False\n",
              ),
              (
                  "def accepted(record: dict) -> bool:\n",
                  "def accepted(\n    record: dict,\n    *,\n    now: object = datetime(2026, 9, 12, 5, 0, tzinfo=timezone.utc),\n) -> bool:\n",
              ),
              (
                  "        now=datetime(2026, 9, 12, 5, 0, tzinfo=timezone.utc),\n",
                  "        now=now,\n",
              ),
              (
                  "    require(accepted(good), \"valid exact isolated restore evidence must pass\")\n\n    mutations = []\n",
                  "    require(accepted(good), \"valid exact isolated restore evidence must pass\")\n    require(\n        not accepted(good, now=\"2026-09-12T05:00:00Z\"),\n        \"non-datetime evaluation clock must fail closed\",\n    )\n    require(\n        not accepted(good, now=datetime(2026, 9, 12, 5, 0)),\n        \"timezone-naive evaluation clock must fail closed\",\n    )\n    require(not accepted(good, now=None), \"missing evaluation clock must fail closed\")\n\n    mutations = []\n",
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one validator patch target: {old!r}")
              source = source.replace(old, new, 1)
          validator.write_text(source, encoding="utf-8")

          doc = Path("docs/RESTORE-VERIFICATION-V1.2.md")
          text = doc.read_text(encoding="utf-8")
          old = "Consumers may shorten evidence freshness, but they must not extend Everkeep's evidence validity.\n"
          new = (
              "The consumer evaluation clock must be a timezone-aware datetime. Missing, malformed, or "
              "timezone-naive evaluation clocks fail closed rather than bypassing or crashing freshness evaluation.\n\n"
              + old
          )
          if text.count(old) != 1:
              raise SystemExit("expected exactly one restore-verification documentation patch target")
          doc.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate exact isolated restore contract
        run: python3 scripts/validate_restore_verification_v12.py
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_restore_verification_v12.py
      - name: Commit hardened consumer boundary
        run: |
          if git diff --quiet -- scripts/validate_restore_verification_v12.py docs/RESTORE-VERIFICATION-V1.2.md; then
            echo "Everkeep consumer clock boundary already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_restore_verification_v12.py docs/RESTORE-VERIFICATION-V1.2.md
          git commit -m "fix: fail closed on invalid restore evaluation clocks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
