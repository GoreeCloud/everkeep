name: Validate Care Everkeep prequalification

on:
  pull_request:
    paths:
      - 'acceptance/goreecloud-care.0.1.0.prequalification.json'
      - 'scripts/validate_care_prequalification.py'
      - '.github/workflows/validate-care-prequalification.yml'
  push:
    branches:
      - main
    paths:
      - 'acceptance/goreecloud-care.0.1.0.prequalification.json'
      - 'scripts/validate_care_prequalification.py'
      - '.github/workflows/validate-care-prequalification.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate fail-closed Care continuity prequalification
        run: python3 scripts/validate_care_prequalification.py

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_care_prequalification.py
