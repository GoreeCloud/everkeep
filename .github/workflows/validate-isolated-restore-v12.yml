name: Validate Everkeep isolated restore v1.2

on:
  pull_request:
    paths:
      - "contracts/everkeep.restore-verification.v1.2.schema.json"
      - "scripts/validate_restore_verification_v12.py"
      - "docs/RESTORE-VERIFICATION-V1.2.md"
      - "FEATURE-ROADMAP.md"
      - ".github/workflows/validate-isolated-restore-v12.yml"
  push:
    branches: [main]
    paths:
      - "contracts/everkeep.restore-verification.v1.2.schema.json"
      - "scripts/validate_restore_verification_v12.py"
      - "docs/RESTORE-VERIFICATION-V1.2.md"
      - "FEATURE-ROADMAP.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate exact isolated restore contract
        run: python3 scripts/validate_restore_verification_v12.py
      - name: Validate JSON syntax
        run: python3 -m json.tool contracts/everkeep.restore-verification.v1.2.schema.json >/dev/null
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_restore_verification_v12.py
