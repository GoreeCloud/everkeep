name: Validate Everkeep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate Everkeep identity contract
        run: python3 scripts/validate_continuity.py
      - name: Validate evidence validity contract
        run: python3 scripts/validate_evidence_validity.py
      - name: Validate Phase 1 Mesh and readiness contracts
        run: python3 scripts/validate_phase1.py
      - name: Validate Phase 1 execution layer
        run: python3 scripts/validate_execution_layer.py
      - name: Validate persistent service layer
        run: python3 scripts/validate_persistence.py
      - name: Validate service and API layer
        run: python3 scripts/validate_service_api.py
      - name: Validate runtime integration layer
        run: python3 scripts/validate_runtime_integration.py
      - name: Validate deployment readiness layer
        run: python3 scripts/validate_deployment_readiness.py
      - name: Validate staging verification layer
        run: python3 scripts/validate_staging_verification.py
      - name: Validate live acceptance layer
        run: python3 scripts/validate_live_acceptance.py
      - name: Validate restore verification evidence contract
        run: python3 scripts/validate_restore_verification.py
      - name: Validate Phase 2 Recovery Center
        run: python3 scripts/validate_phase2_recovery_center.py
      - name: Validate Phase 2 resource evidence timeline
        run: python3 scripts/validate_phase2_evidence_timeline.py
      - name: Validate Phase 2 recovery orchestration
        run: python3 scripts/validate_phase2_orchestrator.py
      - name: Validate Phase 2 restore-test scheduling
        run: python3 scripts/validate_phase2_restore_testing.py
      - name: Validate Phase 2 preservation and portability
        run: python3 scripts/validate_phase2_preservation.py
      - name: Validate Phase 2 succession
        run: python3 scripts/validate_phase2_succession.py
      - name: Validate Phase 3 continuity control plane
        run: python3 scripts/validate_phase3_continuity.py
      - name: Validate Phase 3 recovery topology and failover planning
        run: python3 scripts/validate_phase3_failover_planning.py
      - name: Validate Phase 3 scheduled continuity assurance
        run: python3 scripts/validate_phase3_continuity_assurance.py
      - name: Validate Phase 3 failover governance
        run: python3 scripts/validate_phase3_failover_governance.py
      - name: Validate Phase 3 controlled failover executor
        run: python3 scripts/validate_phase3_failover_executor.py
      - name: Validate Phase 3 drill operations and rollback assurance
        run: python3 scripts/validate_phase3_drill_operations.py
      - name: Validate Phase 3 failover lifecycle projection
        run: python3 scripts/validate_phase3_failover_lifecycle.py
      - name: Test Everkeep Mesh evidence envelope adapter
        run: python3 scripts/test_mesh_evidence.py
      - name: Test authenticated Everkeep Mesh evidence delivery
        run: python3 scripts/test_mesh_delivery.py
      - name: Validate Continuity Center responsive and accessibility rules
        run: python3 scripts/validate_public_responsive.py
      - name: Build Everkeep public website from immutable V1.1 source
        run: python3 scripts/build_public_site.py
      - name: Validate Everkeep public website artifact
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/site-polish.css
          test -f dist/site.js
          test -f dist/assets/glaze/glaze-v1.1.0.css
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/assets/everkeep.svg
          test "$(find dist/assets/glaze -type f | wc -l)" -eq 13
          cmp website/style.css dist/style.css
          cmp website/site-polish.css dist/site-polish.css
          cmp website/site.js dist/site.js
          cmp assets/everkeep.svg dist/assets/everkeep.svg
          grep -Fq 'https://everkeep.goreecloud.com/' dist/index.html
          grep -Fq 'data-glaze-version="1.1"' dist/index.html
          grep -Fq 'name="goreecloud-glaze-ui" content="1.1.0"' dist/index.html
          grep -Fq 'data-glaze-ui="1.1.0"' dist/index.html
          grep -Fq 'assets/glaze/glaze-v1.1.0.css' dist/index.html
          grep -Fq 'glz11-soft-glaze' dist/index.html
          grep -Fq 'Everkeep is GoreeCloud' dist/index.html
          grep -Fq 'A backup existing is not the same as being recoverable.' dist/index.html
          grep -Fq 'Normalized continuity states' dist/index.html
          grep -Fq 'GoreeCloud Identity · Mesh' dist/index.html
          grep -Fq 'GLAZE UI V1.1 defines presentation only.' dist/index.html
          ! grep -Fq 'Glaze UI 2.1' dist/index.html
          ! grep -Fq 'data-glaze-ui="2.1.0"' dist/index.html
          ! test -f website/glaze-ui-2.1.0.css
          ! test -f website/GLAZE-UI-2.1-ADOPTION.md
      - name: Exercise Continuity Center responsive geometry in Chrome
        run: python3 scripts/browser_public_responsive.py
